server.port=8082

# C\u1ea5u h\u00ecnh k\u1ebft n\u1ed1i SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=InternalWebsiteUptimeChecker;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# SQL Server credentials: set SPRING_DATASOURCE_PASSWORD in the environment.
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.cookie.name=QLSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
spring.jackson.time-zone=UTC
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:qlwebsite@localhost}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
# External delivery is retired; in-app alerts and delivery history remain available.
app.notifications.external-enabled=false
app.jobs.enabled=${MONITOR_JOBS_ENABLED:true}
spring.jpa.open-in-view=false
server.error.include-message=always
server.tomcat.max-http-form-post-size=2MB
